<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulated-Chatbot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css" />
  <script src="main.js" defer></script>
</head>

<body class="bg-dark text-light">
  <div class="container py-4">
    <div class="chat-container mx-auto">
      <div class="chat-header p-3">
        Simulated Chat
      </div>
      <div id="chatArea" class="p-3">
      </div>
      <div class="chat-input p-3">
        <div class="input-group">
          <input id="messageInput" type="text" class="form-control dark" placeholder="Send a message" />
          <button id="sendBtn" class="btn btn-primary btn-color">Send</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
